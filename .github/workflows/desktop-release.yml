name: Desktop release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
      - name: Compare versions
        run: |
          packageVersion="$(node -p "require('./package.json').version")"
          tagVersion="${GITHUB_REF_NAME#v}"
          if [ "$packageVersion" != "$tagVersion" ]; then
            echo "package.json version ($packageVersion) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    name: Build ${{ matrix.os }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
      - name: Setup node
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Build web and desktop sources
        run: npm run desktop:build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: desktop-${{ matrix.os }}
          path: |
            release/*.AppImage
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft
          --title "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          release-artifacts/*
