name: Desktop release

on:
  push:
    tags: ['v*']

jobs:
  verify:
    name: Verify tag matches package version
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
      - name: Compare versions
        run: |
          packageVersion="$(node -p "require('./package.json').version")"
          tagVersion="${GITHUB_REF_NAME#v}"
          if [ "$packageVersion" != "$tagVersion" ]; then
            echo "package.json version ($packageVersion) does not match tag $GITHUB_REF_NAME"
            exit 1
          fi

  build:
    name: Build ${{ matrix.platform }}
    needs: verify
    runs-on: ${{ matrix.os }}
    environment: desktop
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: windows-latest
            platform: windows
          - os: macos-latest
            platform: mac
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
      - name: Setup node
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Install pacman packaging tools
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install --yes libarchive-tools
      - name: Install dependencies
        run: npm ci
      - name: Verify GIF server URL is available
        shell: bash
        env:
          VITE_GIF_SERVER_URL: ${{ vars.VITE_GIF_SERVER_URL }}
        run: |
          if [ -z "$VITE_GIF_SERVER_URL" ]; then
            echo "::error::VITE_GIF_SERVER_URL is empty, so this build would ship with no GIFs tab."
            echo ""
            echo "The tab is compiled out when the variable is unset at build time, and nothing"
            echo "fails at runtime - the tab is simply absent."
            echo ""
            echo "Set VITE_GIF_SERVER_URL to the GIF server origin at"
            echo "Settings > Environments > desktop > Environment variables,"
            echo "and check that this job declares 'environment: desktop'."
            exit 1
          fi
      - name: Build web and desktop sources
        env:
          VITE_GIF_SERVER_URL: ${{ vars.VITE_GIF_SERVER_URL }}
        run: npm run desktop:build
      - name: Package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npx electron-builder --publish never
      - name: Verify deb and pacman can self-update
        if: runner.os == 'Linux'
        run: |
          reportMissingMarker() {
            echo "::error::$1 has no resources/package-type marker. Anyone who installs it will never get an update."
            echo ""
            echo "electron-updater reads that marker to pick its updater. Without it there is no"
            echo "working update path, and nothing fails at build time."
            echo ""
            echo "The marker is written only when the publish config resolves."
            echo "electron-builder.yml needs this block at the top level:"
            echo ""
            echo "  publish:"
            echo "    provider: github"
            echo "    owner: 0xTheCrow"
            echo "    repo: durnible"
            echo ""
            echo "If it is intact, check the Package step log for 'adding autoupdate files for:'"
            echo "- one line per fpm target. A missing line means publish config, not packaging."
            exit 1
          }

          for debPath in release/*.deb; do
            dpkg-deb -c "$debPath" | grep 'resources/package-type' > /dev/null \
              || reportMissingMarker "$debPath"
          done

          for pacmanPath in release/*.pacman; do
            bsdtar -tf "$pacmanPath" | grep 'resources/package-type' > /dev/null \
              || reportMissingMarker "$pacmanPath"
          done

          echo "deb and pacman both carry their update markers."
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: desktop-${{ matrix.platform }}
          path: |
            release/*.AppImage
            release/*.deb
            release/*.pacman
            release/*.exe
            release/*.dmg
            release/latest*.yml
            release/*.blockmap
          if-no-files-found: error

  android:
    name: Build android
    needs: verify
    runs-on: ubuntu-latest
    environment: android
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4.2.0
      - name: Setup node
        uses: actions/setup-node@v4.4.0
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'
      - name: Setup java
        uses: actions/setup-java@v4.7.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3.2.2
      - name: Install dependencies
        run: npm ci
      - name: Verify GIF server URL is available
        env:
          VITE_GIF_SERVER_URL: ${{ vars.VITE_GIF_SERVER_URL }}
        run: |
          if [ -z "$VITE_GIF_SERVER_URL" ]; then
            echo "::error::VITE_GIF_SERVER_URL is empty, so this APK would ship with no GIFs tab."
            echo "See the desktop build job for the full explanation."
            exit 1
          fi
      - name: Restore signing keystore
        env:
          DURNIBLE_KEYSTORE_BASE64: ${{ secrets.DURNIBLE_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$DURNIBLE_KEYSTORE_BASE64" ]; then
            echo "::error::DURNIBLE_KEYSTORE_BASE64 is empty, so this APK could not be signed."
            echo ""
            echo "Android refuses to install an unsigned APK, and an APK signed with a different"
            echo "key cannot update an existing install."
            echo ""
            echo "Set it at Settings > Environments > desktop > Environment secrets, to the output of:"
            echo "  base64 -w0 <path to durnible-release.jks>"
            exit 1
          fi
          printf '%s' "$DURNIBLE_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/durnible-release.jks"
      - name: Build signed APK
        env:
          VITE_GIF_SERVER_URL: ${{ vars.VITE_GIF_SERVER_URL }}
          DURNIBLE_KEYSTORE_PATH: ${{ runner.temp }}/durnible-release.jks
          DURNIBLE_KEYSTORE_PASSWORD: ${{ secrets.DURNIBLE_KEYSTORE_PASSWORD }}
          DURNIBLE_KEY_ALIAS: ${{ secrets.DURNIBLE_KEY_ALIAS }}
        run: npm run mobile:release
      - name: Verify the APK is signed with the release key
        run: |
          set -o pipefail
          apkPath=platform/mobile/android/app/build/outputs/apk/release/app-release.apk
          apksigner="$(ls "$ANDROID_HOME"/build-tools/*/apksigner | head -1)"
          certificates="$("$apksigner" verify --print-certs "$apkPath")"
          echo "$certificates"
          if printf '%s' "$certificates" | grep -q "CN=Android Debug"; then
            echo "::error::APK is signed with the debug key. It would not update any real install."
            exit 1
          fi
          "$apksigner" verify -v "$apkPath"
      - name: Name the APK after the release
        run: |
          mv platform/mobile/android/app/build/outputs/apk/release/app-release.apk \
            "durnible-${GITHUB_REF_NAME#v}.apk"
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android
          path: durnible-*.apk
          if-no-files-found: error

  publish:
    name: Publish draft release
    needs: [build, android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v4.1.8
        with:
          path: release-artifacts
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >
          gh release create "$GITHUB_REF_NAME" --draft
          --title "$GITHUB_REF_NAME"
          --repo "$GITHUB_REPOSITORY"
          release-artifacts/*
